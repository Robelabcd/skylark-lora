[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skylark-lora"
version = "0.1.0"
description = "LoRA fine-tuning of a small open LLM for tool calling in the Skylark airline agent"
authors = [{ name = "Robel Berhe" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",        # typed tool definitions + validation (Step 1)
  "python-dotenv>=1",   # loads secrets from .env
]

[project.optional-dependencies]
dev = [
  "pytest>=8",          # automatic tests
  "ruff>=0.6",          # code formatter + linter
]
gpu = [
  "torch",              # runs the model (preinstalled on Colab)
  "transformers>=4.51", # loads Qwen3 (needs 4.51 or newer)
  "accelerate",         # places the model on the GPU (device_map="auto")
]
openai = [
  "openai>=1",          # commercial baseline (Step 4)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skylark_lora = ["datagen/*.json"]   # airport list used by the data generator

[tool.pytest.ini_options]
testpaths = ["tests"]
